# Build manual do agente (sem criar release). Para release automático com tag, use agent-release.yml.
name: Build Agent

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (instalador Inno Setup)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install pyinstaller ultralytics

      - name: Exportar YOLOv8n para ONNX
        run: |
          cd agent
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt').export(format='onnx', imgsz=640)"

      - name: PyInstaller (sem console via .spec; onedir via COLLECT)
        run: |
          $env:PYTHONPATH = $PWD
          pyinstaller agent/olhovivo-agent.spec --noconfirm

      - name: Verificar ONNX
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/olhovivo-agent/yolov8n.onnx")) { exit 1 }

      - name: Instalar Inno Setup 6
        run: choco install innosetup -y

      - name: Compilar instalador (ISCC)
        shell: cmd
        run: "\"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe\" /Q agent\\olhovivo-setup.iss"

      - name: Verificar OlhoVivoSetup.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-installer/OlhoVivoSetup.exe")) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: olhovivo-agent-windows
          path: dist-installer/OlhoVivoSetup.exe
          retention-days: 30
