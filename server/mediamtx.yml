# MediaMTX v1.x — configuração mínima para testes
api: true
apiAddress: :9997
authInternalUsers:
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: api
      - action: read
      - action: publish

rtsp: true
rtspAddress: :8554

hls: true
hlsAddress: :8888
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 2s
hlsAllowOrigins:
  - https://sistema-antifurto.vercel.app
  - http://localhost:3000
  - http://localhost:5173

paths:
  all_others: {}
