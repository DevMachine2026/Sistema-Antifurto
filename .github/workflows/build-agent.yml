name: Build Agent

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          $env:PYTHONPATH = $PWD
          pyinstaller agent/olhovivo-agent.spec --noconfirm

      - name: Zip artifact
        run: Compress-Archive -Path dist/olhovivo-agent -DestinationPath olhovivo-agent-windows.zip

      - name: Upload to Supabase Storage
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # cria o bucket se não existir (ignora erro 409 = já existe)
          curl -s -o /dev/null -X POST \
            "${SUPABASE_URL}/storage/v1/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"agent-releases","name":"agent-releases","public":true}' || true

          # faz o upload do zip
          curl -f -X POST \
            "${SUPABASE_URL}/storage/v1/object/agent-releases/olhovivo-agent-windows.zip" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @olhovivo-agent-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: olhovivo-agent-windows
          path: olhovivo-agent-windows.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: olhovivo-agent-windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Olho Vivo Agent ${{ github.ref_name }}"
          body: |
            ## Como instalar

            Use o link de instalação gerado na plataforma. O download inicia automaticamente.
          files: |
            olhovivo-agent-windows.zip
